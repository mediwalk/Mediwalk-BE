app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mediwalk.site,https://www.mediwalk.site,https://api.mediwalk.site,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

  tmap:
    api-key: ${TMAP_APP_KEY:}
    pedestrian-route-url: ${TMAP_PEDESTRIAN_ROUTE_URL:https://apis.openapi.sk.com/tmap/routes/pedestrian}
    # 경로 폴리라인을 따라 근처 POI 후보 검색 시 사용 (키 없으면 서비스는 빈 목록 반환)
    poi-around-search-url: ${TMAP_POI_AROUND_SEARCH_URL:https://apis.openapi.sk.com/tmap/pois/search/around}
    poi-sample-interval-meters: 260 # 샘플 지점 간 거리(m)
    poi-sample-max-points: 14       # 폴당 최대 검색 원 개수 상한
    poi-search-radius-km: "1"       # SK 주변 POI: 정수 km만 허용(1~33), 전국은 0. 소수는 올림되어 전송됨
    poi-mart-categories: "대형마트;마트"
    poi-park-categories: "공원"
    poi-search-count-per-call: 18   # per-center count (최대 50)
    # 폴리라인(선분)까지 최단거리 순으로 자를 때 카테고리당 최대 개수 (기본 1 = 마트·공원 각 1곳)
    poi-max-suggestions-per-category: 1
    poi-max-distance-to-polyline-meters: 200 # routeSegments 마트·공원 포함: 폴리라인까지 이 거리 이내만
    poi-parallelism: 8              # 샘플 지점별 Tmap POI 호출을 동시에 보낼 스레드 수

  ai:
    medicine-verification:
      project-id: ${GCP_PROJECT_ID:}
      endpoint-id: ${GCP_ENDPOINT_ID:}
      region: ${GCP_REGION:us-central1}
      credentials-path: ${GCP_CREDENTIALS_PATH:}

spring:
  application:
    name: mediwalk-be

  config:
    import: optional:classpath:application-local.yaml

  datasource:
    url: jdbc:mysql://localhost:3306/mediwalk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    open-in-view: false

firebase:
  enabled: false