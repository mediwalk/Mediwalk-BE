app:
  tmap:
    api-key: ${TMAP_APP_KEY:}
    pedestrian-route-url: ${TMAP_PEDESTRIAN_ROUTE_URL:https://apis.openapi.sk.com/tmap/routes/pedestrian}

  ai:
    route-generation-url: ${AI_ROUTE_GENERATION_URL:}
    medicine-verification:
      project-id: ${GCP_PROJECT_ID:}
      endpoint-id: ${GCP_ENDPOINT_ID:}
      region: ${GCP_REGION:us-central1}
      credentials-path: ${GCP_CREDENTIALS_PATH:}

spring:
  application:
    name: mediwalk-be

  config:
    import: optional:classpath:application-local.yaml

  datasource:
    url: jdbc:mysql://localhost:3306/mediwalk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    open-in-view: false

firebase:
  enabled: false